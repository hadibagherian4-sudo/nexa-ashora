{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2 class="h-title"><span class="icon">📝</span> ثبت‌نام کاربر</h2>
  <div class="muted">پس از ثبت‌نام، به صفحه ورود برمی‌گردید.</div>

  {% if error %}
    <div class="error">⚠️ {{ error }}</div>
  {% endif %}

  <form method="post" action="/register">
    <div class="row">
      <div>
        <label><span class="icon">🙍‍♂️</span> نام و نام خانوادگی</label>
        <input name="name" required>
      </div>
      <div>
        <label><span class="icon">📱</span> شماره همراه</label>
        <input name="phone" placeholder="مثال: 0912xxxxxxx" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label><span class="icon">🪪</span> کد ملی</label>
        <input name="nid" placeholder="۱۰ رقم" required>
      </div>
      <div></div>
    </div>

    <div class="row">
      <div>
        <label><span class="icon">🔑</span> رمز عبور</label>
        <input type="password" name="password1" required>
      </div>
      <div>
        <label><span class="icon">🔁</span> تکرار رمز عبور</label>
        <input type="password" name="password2" required>
      </div>
    </div>

    <div class="actions">
      <button class="btn" type="submit">✅ ایجاد حساب</button>
      <a class="btn secondary" href="/login">↩️ ورود</a>
      <a class="btn secondary" href="/start">🏠 صفحه شروع</a>
    </div>
  </form>
</div>
{% endblock %}
