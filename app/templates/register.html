{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="h-title">
    <span class="icon">📝</span>
    <h2 style="margin:0;">ثبت‌نام کاربر</h2>
  </div>
  <div class="muted">بعد از ثبت‌نام، به صفحه ورود برمی‌گردید.</div>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/signup">
    <div class="row">
      <div>
        <label>👤 نام و نام خانوادگی</label>
        <input name="name" required>
      </div>
      <div>
        <label>📱 شماره همراه</label>
        <input name="phone" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label>🪪 کد ملی</label>
        <input name="nid" required placeholder="۱۰ رقم">
      </div>
      <div></div>
    </div>

    <div class="row">
      <div>
        <label>🔑 رمز عبور</label>
        <input type="password" name="password1" required>
      </div>
      <div>
        <label>🔁 تکرار رمز عبور</label>
        <input type="password" name="password2" required>
      </div>
    </div>

    <div class="actions">
      <button class="btn" type="submit">✅ ایجاد حساب</button>
      <a class="btn secondary" href="/login">🔐 برگشت به ورود</a>
      <a class="btn secondary" href="/start">🏠 صفحه شروع</a>
    </div>
  </form>
</div>
{% endblock %}
