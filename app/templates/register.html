{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2 style="margin-top:0;">ثبت‌نام کاربر</h2>
  <div class="muted" style="margin-bottom:14px;">اگر حساب کاربری ندارید، ثبت‌نام کنید.</div>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post" action="/register">
    <div class="row">
      <div>
        <label>نام و نام خانوادگی</label>
        <input name="name" required>
      </div>
      <div>
        <label>شماره همراه</label>
        <input name="phone" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label>کد ملی</label>
        <input name="nid" required>
      </div>
      <div>
        <label>رمز عبور</label>
        <input type="password" name="password" required>
      </div>
    </div>

    <label>تکرار رمز عبور</label>
    <input type="password" name="password2" required>

    <div style="margin-top:12px;">
      <button class="btn" type="submit">ایجاد حساب</button>
      <a href="/login" class="btn" style="background:#eee; color:#111; text-decoration:none; margin-right:8px;">بازگشت</a>
    </div>
  </form>
</div>
{% endblock %}
