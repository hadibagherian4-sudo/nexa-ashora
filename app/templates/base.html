<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NEXA</title>
  <style>
    body{font-family:tahoma;background:#f3f4f6;margin:0;color:#0b1220}
    .shell{max-width:1100px;margin:18px auto 80px;padding:0 12px}
    .header{background:#0b2a4a;color:#fff;border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
    .panel{background:#fff;border-radius:16px;padding:16px;border:1px solid rgba(15,23,42,.14);margin-top:12px}
    .btn{padding:9px 12px;border-radius:12px;border:1px solid rgba(15,23,42,.14);background:#fff;cursor:pointer;text-decoration:none;color:#0b1220}
    .btn-primary{background:#f6c445;border:none;font-weight:900}
    input,select,textarea{width:100%;padding:10px;border-radius:12px;border:1px solid rgba(15,23,42,.14)}
    textarea{min-height:110px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .nav{position:fixed;left:0;right:0;bottom:0;background:#071a30;color:#fff;padding:10px 14px}
    .nav a{color:#fff;text-decoration:none;margin:0 10px;font-weight:900}
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <div style="font-weight:900;font-size:20px">نکسا (NEXA)</div>
      <div>
        {% if s %}
          <a class="btn" href="/">🏠</a>
          <a class="btn btn-primary" href="/logout">خروج</a>
        {% endif %}
      </div>
    </div>

    {% block content %}{% endblock %}
  </div>

  {% if s %}
  <div class="nav">
    <a href="/">🏠 صفحه اصلی</a>
    <a href="/forum">💬 تالار گفتگو</a>
    <a href="/profile">👤 پروفایل</a>
  </div>
  {% endif %}
</body>
</html>
