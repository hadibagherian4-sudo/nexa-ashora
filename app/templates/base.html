<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{{ title or "NEXA" }}</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>
  <header class="topbar">
    <div class="brand">نکسا (NEXA) | نظام یکپارچه محتوا عاشورا</div>
    {% if auth %}
      <div class="who">
        <span>{{ auth.name }} ({{ auth.role }})</span>
        <form method="post" action="/auth/logout" style="display:inline;">
          <button class="btn primary">خروج</button>
        </form>
      </div>
    {% endif %}
  </header>

  <nav class="nav">
    {% if auth %}
      <a href="/">🏠 صفحه اصلی</a>
      <a href="/forum">💬 تالار گفتگو</a>
      <a href="/profile">👤 پروفایل</a>
      {% if auth.role == "manager" %}
        <a href="/admin/export/users">📥 اکسل کاربران</a>
        <a href="/admin/export/referees">📥 اکسل داوران</a>
      {% endif %}
    {% endif %}
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
