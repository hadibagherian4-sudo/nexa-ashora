<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "نکسا (NEXA)" }}</title>

  <!-- فونت فارسی (گوگل) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    body{
      font-family: "Vazirmatn", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#f6f7fb;
      color:#111;
      margin:0;
      direction: rtl;
      text-align: right;
    }
    .wrap{max-width: 980px; margin: 24px auto; padding: 0 16px;}
    .topbar{
      background:#0b2f4f;
      color:#fff;
      border-radius:14px;
      padding:14px 18px;
      font-weight:800;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .card{
      background:#fff;
      border-radius:14px;
      padding:18px;
      margin-top:14px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
      border: 1px solid #eee;
    }
    label{display:block; font-weight:600; margin: 10px 0 6px;}
    input, select, textarea{
      width:100%;
      box-sizing:border-box;
      padding:10px 12px;
      border:1px solid #d9dce3;
      border-radius:10px;
      outline:none;
      font-family: inherit;
      font-size:14px;
      text-align:right;
      direction:rtl;
    }
    .row{display:grid; grid-template-columns: 1fr 1fr; gap: 12px;}
    .btn{
      background:#f1b61a;
      border:none;
      border-radius:10px;
      padding:10px 14px;
      font-weight:800;
      cursor:pointer;
    }
    .btn:hover{filter:brightness(.95);}
    .muted{color:#666; font-size:13px;}
    .error{color:#c62828; font-weight:700; margin: 8px 0;}
    .hr{height:1px; background:#eee; margin:16px 0;}
  </style>
</head>
<body>
  <div class="wrap">

    <div class="topbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <img src="/static/logo.png" alt="لوگو سازمان"
     style="height:40px; width:auto; border-radius:8px;">

        <div style="display:flex; flex-direction:column; line-height:1.1;">
          <div style="font-weight:800;">نکسا (NEXA)</div>
          <div style="font-size:12px; font-weight:400; opacity:0.85;">
            نظام یکپارچه محتوا عاشورا
          </div>
        </div>
      </div>

      <div class="muted" style="color:#cfe6ff">{{ subtitle or "" }}</div>
    </div>

    {% block content %}{% endblock %}

  </div> <!-- end .wrap -->
</body>
</html>
