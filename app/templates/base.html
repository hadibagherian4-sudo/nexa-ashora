<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "نکسا (NEXA)" }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <!-- اگر لوگوت پس‌زمینه سفید دارد، باید فایل PNG شفاف جایگزین شود -->
        <img src="/static/logo.png" alt="لوگو سازمان">
        <div>
          <div class="brand-title">نکسا (NEXA)</div>
          <div class="brand-sub">نظام یکپارچه محتوا عاشورا</div>
        </div>
      </div>

      <div class="badge">
        <span>ℹ️</span>
        <span>{{ subtitle or "" }}</span>
      </div>
    </div>

    {% block content %}{% endblock %}
  </div>
</body>
</html>
