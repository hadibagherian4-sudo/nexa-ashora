{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="h-title">
    <span class="icon">🔐</span>
    <h2 style="margin:0;">ورود به سامانه</h2>
  </div>
  <div class="muted">لطفاً نقش و اطلاعات ورود را وارد کنید.</div>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <div class="row">
      <div>
        <label>🎭 نقش</label>
        <select name="role" required>
          <option value="user">👤 کاربر</option>
          <option value="referee">🧑‍⚖️ داور</option>
          <option value="manager">🛡️ مدیر سامانه</option>
        </select>
      </div>

      <div>
        <label>📱 شماره همراه</label>
        <input name="phone" placeholder="مثال: 0912xxxxxxx" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label>🔑 رمز عبور</label>
        <input type="password" name="password" required>
      </div>

      <div>
        <label>🪪 کد ملی (برای داور/مدیر)</label>
        <input name="nid" placeholder="۱۰ رقم">
      </div>
    </div>

    <div class="actions">
      <button class="btn" type="submit">✅ ورود</button>
      <a class="btn secondary" href="/start">🏠 صفحه شروع</a>
      <a class="btn secondary" href="/register">📝 ثبت‌نام کاربر</a>
      <a class="btn secondary" href="/logout">🚪 خروج</a>
    </div>
  </form>

</div>
{% endblock %}
