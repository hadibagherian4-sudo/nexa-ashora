{% extends "base.html" %}
{% block content %}
<div class="panel">
  <h2>ورود</h2>
  {% if error %}<p style="color:#b91c1c;font-weight:900">{{ error }}</p>{% endif %}

  <form method="post" action="/login" class="grid">
    <div>
      <label>نقش</label>
      <select name="role">
        <option value="user">کاربر</option>
        <option value="referee">داور</option>
        <option value="manager">مدیر</option>
      </select>
    </div>
    <div><label>شماره</label><input name="phone"></div>
    <div><label>کد ملی (داور/مدیر)</label><input name="nid"></div>
    <div><label>رمز</label><input type="password" name="password"></div>
    <div style="grid-column:1/-1"><button class="btn btn-primary" type="submit">ورود</button></div>
  </form>

  <hr style="margin:18px 0">
  <h3>ثبت نام (کاربر)</h3>
  <form method="post" action="/signup" class="grid">
    <div><label>نام</label><input name="name"></div>
    <div><label>شماره</label><input name="phone"></div>
    <div><label>کد ملی</label><input name="nid"></div>
    <div><label>رمز</label><input type="password" name="password1"></div>
    <div><label>تکرار</label><input type="password" name="password2"></div>
    <div style="grid-column:1/-1"><button class="btn btn-primary" type="submit">ثبت نام</button></div>
  </form>
</div>
{% endblock %}
