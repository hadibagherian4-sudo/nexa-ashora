{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2 style="margin:0 0 8px;">ورود به سامانه</h2>
  <div class="muted">لطفاً نقش و اطلاعات ورود را وارد کنید.</div>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <div class="row">
      <div>
        <label>نقش</label>
        <select name="role" required>
          <option value="user">کاربر</option>
          <option value="referee">داور</option>
          <option value="manager">مدیر سامانه</option>
        </select>
      </div>
      <div>
        <label>شماره همراه</label>
        <input name="phone" placeholder="مثال: 0912xxxxxxx" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label>رمز عبور</label>
        <input type="password" name="password" required>
      </div>
      <div>
        <label>کد ملی (برای داور/مدیر)</label>
        <input name="nid" placeholder="۱۰ رقم">
      </div>
    </div>

    <div style="margin-top:12px;">
      <button class="btn" type="submit">ورود</button>
      <a href="/logout" class="muted" style="margin-right:10px;">خروج</a>
    </div>
  </form>

  <div class="hr"></div>

  <h3 style="margin:0 0 8px;">ثبت‌نام کاربر</h3>
  <div class="muted">در صورتی که حساب کاربری ندارید، ثبت‌نام کنید.</div>

  <form method="post" action="/signup">
    <div class="row">
      <div>
        <label>نام و نام خانوادگی</label>
        <input name="name" required>
      </div>
      <div>
        <label>شماره همراه</label>
        <input name="phone" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label>کد ملی</label>
        <input name="nid" required>
      </div>
      <div></div>
    </div>

    <div class="row">
      <div>
        <label>رمز عبور</label>
        <input type="password" name="password1" required>
      </div>
      <div>
        <label>تکرار رمز عبور</label>
        <input type="password" name="password2" required>
      </div>
    </div>

    <div style="margin-top:12px;">
      <button class="btn" type="submit">ایجاد حساب</button>
    </div>
  </form>
</div>
{% endblock %}
